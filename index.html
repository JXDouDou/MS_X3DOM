<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>營造法式數位平台</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 首頁 = 入口（hub）：每張卡片連到一個功能頁 -->
  <main class="hub">
    <h1>營造法式數位平台</h1>
    <p>選一個功能開始。</p>

    <div class="cards">
      <a class="card" href="./lab.html">
        <span class="tag ready">可以用</span>
        <h2>構件實驗室</h2>
        <p>用滑桿調材等、柱高、柱徑，即時重新產生柱與枓栱；點構件看資訊、一鍵拆開／組合。</p>
      </a>

      <a class="card" href="./walk.html">
        <span class="tag ready">可以用</span>
        <h2>建築漫遊</h2>
        <p>第一人稱走進殿堂裡看枓栱；可調面闊、進深、間廣、柱高。之後換成 SketchUp 大樣模型。</p>
      </a>

      <a class="card" href="https://night2021-2021.github.io/MS_X3DD3/" target="_blank" rel="noopener">
        <span class="tag">舊網站</span>
        <h2>數位典藏</h2>
        <p>原本的 111 個 X3D 模型、宮殿大樣、枓栱組裝（開新分頁）。</p>
      </a>

      <div class="card disabled">
        <span class="tag">規劃中</span>
        <h2>枓栱組裝</h2>
        <p>逐層組裝動畫、構件分類高亮。</p>
      </div>

      <div class="card disabled">
        <span class="tag">規劃中</span>
        <h2>彩畫產生</h2>
        <p>依構件尺寸重新產生彩畫貼圖。</p>
      </div>
    </div>
  </main>
</body>
</html>
